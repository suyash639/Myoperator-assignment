[project]
name = "talentflow-acme-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.1.3",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
